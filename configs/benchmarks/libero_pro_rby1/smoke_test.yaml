# Cross-embodiment Pro gate: one perturbed task and one initial state.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero-pro-rby1:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero_rby1.benchmark:LIBERORBY1Benchmark"
    subname: libero_object_object_rby1_right_proof
    episodes_per_task: 1
    max_tasks: 1
    params:
      suite: libero_object_object
      max_steps: 280
      seed: 7
      num_steps_wait: 1
