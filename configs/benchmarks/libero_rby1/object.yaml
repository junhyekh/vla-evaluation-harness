# Complete LIBERO-Object order on the fixed-base RBY1 right arm (10 × 50).
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero-rby1:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero_rby1.benchmark:LIBERORBY1Benchmark"
    subname: libero_object_rby1_right
    episodes_per_task: 50
    params:
      suite: libero_object
      seed: 7
      num_steps_wait: 10
