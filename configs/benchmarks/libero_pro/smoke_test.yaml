# Minimal official LIBERO-Pro smoke test: 1 task, 1 episode.
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero-pro:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero_pro.benchmark:LIBEROProBenchmark"
    subname: libero_goal_object
    episodes_per_task: 1
    max_tasks: 1
    params:
      suite: libero_goal
      perturbation: object
      seed: 7
      num_steps_wait: 1
