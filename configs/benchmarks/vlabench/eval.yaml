# VLABench official Track 1 evaluation (10 tasks x 50 fixed episodes)
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/vlabench:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.vlabench.benchmark:VLABenchBenchmark"
    subname: "track_1_in_distribution"
    episodes_per_task: 50
    params:
      eval_track: "track_1_in_distribution"
      robot: "franka"
      seed: 42
