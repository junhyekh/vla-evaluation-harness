# Complete LIBERO-Object order on UR5e + Robotiq85 (10 x 50).
server:
  url: "ws://localhost:8000"

docker:
  image: ghcr.io/allenai/vla-evaluation-harness/libero-ur5:latest

output_dir: "./results"

benchmarks:
  - benchmark: "vla_eval.benchmarks.libero_ur5.benchmark:LIBEROUR5Benchmark"
    subname: libero_object_ur5e_robotiq85
    episodes_per_task: 50
    params:
      suite: libero_object
      seed: 7
      num_steps_wait: 10
